# =====================================================================
#  ReciCUT - infraestructura de desarrollo
#
#  Levanta:  Kafka (el broker de eventos) + kafka-ui (para verlo)
#  MySQL NO esta aqui: cada quien lo tiene instalado en su maquina.
#
#  USO:
#    docker compose up -d        levantar en segundo plano
#    docker compose ps           ver que esta corriendo
#    docker compose logs -f      ver los logs en vivo
#    docker compose down         apagar (conserva los mensajes)
#    docker compose down -v      apagar y BORRAR los mensajes
# =====================================================================

services:

  kafka:
    image: apache/kafka:3.9.0          # version fija: todo el equipo usa la misma
    container_name: recicut-kafka
    ports:
      - "9092:9092"                    # puerto_de_tu_pc : puerto_del_contenedor
    environment:
      # --- Modo KRaft -------------------------------------------------
      # Kafka moderno ya NO necesita Zookeeper: el mismo proceso hace de
      # broker (guarda mensajes) y de controller (coordina el cluster).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # --- Como se anuncia Kafka a quien se conecta -------------------
      # ADVERTISED_LISTENERS es la direccion que Kafka le DICE a los
      # clientes que usen. Si aqui pusieras el nombre del contenedor,
      # tus servicios en IntelliJ no podrian conectarse.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- Ajustes para UN SOLO nodo ----------------------------------
      # En produccion habria 3+ brokers y replicas. Aqui todo es 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Crea los topics solos la primera vez que alguien publica en ellos.
      # Comodo en desarrollo; en produccion se crean a proposito.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: recicut-kafka-ui
    ports:
      - "8090:8080"                    # abre http://localhost:8090
    environment:
      KAFKA_CLUSTERS_0_NAME: recicut
      # OJO: aqui si va "kafka:9092" y no "localhost". Dentro de la red de
      # Docker, cada contenedor se alcanza por el NOMBRE del servicio.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  # Un volumen guarda los mensajes aunque borres el contenedor.
  # Sin esto, cada "docker compose down" perderia todos los eventos.
  kafka-data:
