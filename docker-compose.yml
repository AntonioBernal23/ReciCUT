services:
  config-server:
    build:
      context: .
      dockerfile: ./config-server/Dockerfile
    container_name: config-server
    environment:
      - CONFIG_SERVER_PORT=${CONFIG_SERVER_PORT}
    networks:
      - recicut_network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${CONFIG_SERVER_PORT}/application/default || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure

  discovery-server:
    build:
      context: .
      dockerfile: ./discovery-server/Dockerfile
    container_name: discovery-server
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "${EUREKA_SERVER_PORT}:8761"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:${CONFIG_SERVER_URL}
      - CONFIG_SERVER_URL=${CONFIG_SERVER_URL}
      - EUREKA_SERVER_PORT=${EUREKA_SERVER_PORT}
      - EUREKA_HOSTNAME=${EUREKA_HOSTNAME}
      - EUREKA_CLIENT_REGISTERWITHEUREKA=false
      - EUREKA_CLIENT_FETCHREGISTRY=false
    networks:
      - recicut_network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${EUREKA_SERVER_PORT}/eureka/apps -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure

  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    ports:
      - "127.0.0.1:${MYSQL_AUTH_PORT}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_AUTH_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_AUTH_DATABASE}
      - MYSQL_USER=${MYSQL_AUTH_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_AUTH_PASSWORD}
    volumes:
      - recicut_data_auth:/var/lib/mysql
    networks:
      - recicut_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: always

  mysql-user:
    image: mysql:8.0
    container_name: mysql-user
    ports:
      - "127.0.0.1:${MYSQL_USER_PORT}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_USER_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_USER_DATABASE}
      - MYSQL_USER=${MYSQL_USER_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_USER_PASSWORD}
    volumes:
      - recicut_data_user:/var/lib/mysql
    networks:
      - recicut_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: always

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092" # solo para apps que corren en tu máquina (fuera de Docker)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      # INTERNAL: contenedores (kafka:19092). EXTERNAL: tu host (localhost:9092)
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - recicut_network
    restart: on-failure

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka
    networks:
      - recicut_network

  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    container_name: auth-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_started
      mysql-auth:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:${CONFIG_SERVER_URL}
      - CONFIG_SERVER_URL=${CONFIG_SERVER_URL}
      - AUTH_SERVICE_PORT=${AUTH_SERVICE_PORT}
      - EUREKA_URL=${EUREKA_URL}
      - MYSQL_AUTH_HOST=${MYSQL_AUTH_HOST}
      - MYSQL_AUTH_DATABASE=${MYSQL_AUTH_DATABASE}
      - MYSQL_AUTH_USERNAME=${MYSQL_AUTH_USERNAME}
      - MYSQL_AUTH_PASSWORD=${MYSQL_AUTH_PASSWORD}
      - JPA_DDL_AUTO=${JPA_DDL_AUTO}
      - JPA_SHOW_SQL=${JPA_SHOW_SQL}
      - KAFKA_BROKER=${KAFKA_BROKER}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    networks:
      - recicut_network
    restart: on-failure

  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    container_name: user-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_started
      mysql-user:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:${CONFIG_SERVER_URL}
      - CONFIG_SERVER_URL=${CONFIG_SERVER_URL}
      - USER_SERVICE_PORT=${USER_SERVICE_PORT}
      - EUREKA_URL=${EUREKA_URL}
      - MYSQL_USER_HOST=${MYSQL_USER_HOST}
      - MYSQL_USER_DATABASE=${MYSQL_USER_DATABASE}
      - MYSQL_USER_USERNAME=${MYSQL_USER_USERNAME}
      - MYSQL_USER_PASSWORD=${MYSQL_USER_PASSWORD}
      - JPA_DDL_AUTO=${JPA_DDL_AUTO}
      - JPA_SHOW_SQL=${JPA_SHOW_SQL}
      - KAFKA_BROKER=${KAFKA_BROKER}
    networks:
      - recicut_network
    restart: on-failure

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    container_name: api-gateway
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:${CONFIG_SERVER_URL}
      - CONFIG_SERVER_URL=${CONFIG_SERVER_URL}
      - API_GATEWAY_PORT=${API_GATEWAY_PORT}
      - EUREKA_URL=${EUREKA_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - recicut_network
    restart: on-failure

networks:
  recicut_network:
    driver: bridge

volumes:
  recicut_data_user:
  recicut_data_auth:
  kafka_data: