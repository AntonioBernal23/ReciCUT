server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_USER_HOST:localhost}:3306/recolectores?useSSL=false&serverTimezone=UTC
    username: ${MYSQL_ROOT_USERNAME:root}
    password: ${MYSQL_ROOT_PASSWORD:12345}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true