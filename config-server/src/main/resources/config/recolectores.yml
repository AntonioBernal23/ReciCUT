server:
  port: ${RECOLECTORES_PORT}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_RECOLECTORES_HOST}:3306/${MYSQL_RECOLECTORES_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_RECOLECTORES_USERNAME}
    password: ${MYSQL_RECOLECTORES_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: ${JPA_SHOW_SQL}