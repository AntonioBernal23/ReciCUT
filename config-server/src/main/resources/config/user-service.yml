server:
  port: ${USER_SERVICE_PORT}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_USER_HOST}:3306/${MYSQL_USER_DATABASE}?sslMode=disabled&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_ROOT_USERNAME}
    password: ${MYSQL_ROOT_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: ${JPA_SHOW_SQL}
  kafka:
    bootstrap-servers: ${KAFKA_BROKER}
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.auth_service.events,com.user_service.events"
        spring.json.use.type.headers: true