server:
  port: ${REPORT_SERVICE_PORT}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_REPORT_HOST}:3306/${MYSQL_REPORT_DATABASE}?sslMode=disabled&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_REPORT_USERNAME}
    password: ${MYSQL_REPORT_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: ${JPA_SHOW_SQL}
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKER}